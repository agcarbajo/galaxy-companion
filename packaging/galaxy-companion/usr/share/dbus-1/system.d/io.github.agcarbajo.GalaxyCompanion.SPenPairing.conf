<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.github.agcarbajo.GalaxyCompanion.SPenPairing"/>
  </policy>
  <policy group="input">
    <allow send_destination="io.github.agcarbajo.GalaxyCompanion.SPenPairing"
           send_interface="io.github.agcarbajo.GalaxyCompanion.SPenPairing"/>
    <allow send_destination="io.github.agcarbajo.GalaxyCompanion.SPenPairing"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
  <policy context="default">
    <deny own="io.github.agcarbajo.GalaxyCompanion.SPenPairing"/>
  </policy>
</busconfig>
