<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.github.agcarbajo.GalaxyCompanion.KeyboardFeedback"/>
  </policy>
  <policy context="default">
    <!-- UID and active local seat are checked on every method call. -->
    <allow send_destination="io.github.agcarbajo.GalaxyCompanion.KeyboardFeedback"
           send_interface="io.github.agcarbajo.GalaxyCompanion.KeyboardFeedback"/>
    <allow send_destination="io.github.agcarbajo.GalaxyCompanion.KeyboardFeedback"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
